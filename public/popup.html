<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odds Converter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="images/converter-icon48.png" alt="" width="38" height="38" />
      <div><h1>Odds Converter</h1><p>American odds, translated.</p></div>
    </header>

    <main aria-label="Odds Converter settings">
      <section class="card primary-card" aria-labelledby="conversion-heading">
        <h2 id="conversion-heading" class="sr-only">Conversion controls</h2>
        <label class="toggle-row">
          <span><strong>Enable globally</strong><small>Default for every website</small></span>
          <input id="global-enabled" type="checkbox" role="switch" />
        </label>
        <div id="site-row" class="site-control">
          <label class="toggle-row">
            <span><strong>This site</strong><small id="hostname"></small></span>
            <input id="site-enabled" type="checkbox" role="switch" />
          </label>
          <button id="clear-site-rule" class="link-button" type="button">Use global default</button>
        </div>
        <p id="status" class="status" aria-live="polite">Checking this page…</p>
      </section>

      <details id="appearance-settings" class="card appearance-card">
        <summary>
          <span><strong>Appearance</strong><small>Format and decimal precision</small></span>
          <span class="summary-icon" aria-hidden="true"></span>
        </summary>
        <div class="settings-grid appearance-content">
          <label>Format
            <select id="display-mode">
              <option value="append">+140 (42% implied)</option>
              <option value="append-compact">+140 (41.7%)</option>
              <option value="replace">41.7%</option>
            </select>
          </label>
          <label>Decimal places
            <select id="precision">
              <option value="0">0</option><option value="1">1</option>
              <option value="2">2</option><option value="3">3</option>
            </select>
          </label>
        </div>
      </details>

      <section class="card settings-grid" aria-labelledby="behavior-heading">
        <h2 id="behavior-heading">Behavior</h2>
        <label>Largest odds to recognize
          <select id="maximum-odds">
            <option value="1000">±1,000 (strict)</option>
            <option value="10000">±10,000 (balanced)</option>
            <option value="100000">±100,000 (longshots)</option>
          </select>
        </label>
        <label class="toggle-row compact">
          <span><strong>Live updates</strong><small>Watch changing and newly added odds</small></span>
          <input id="live-updates" type="checkbox" role="switch" />
        </label>
      </section>

      <section class="card calculator" aria-labelledby="calculator-heading">
        <h2 id="calculator-heading">Quick calculator</h2>
        <label for="calculator-input">American odds</label>
        <input id="calculator-input" inputmode="text" placeholder="e.g. -110" autocomplete="off" />
        <output id="calculator-output" for="calculator-input" aria-live="polite"></output>
      </section>
    </main>
    <footer>Probabilities include the sportsbook's vig. Bet responsibly.</footer>
    <script src="js/popup.js"></script>
  </body>
</html>
