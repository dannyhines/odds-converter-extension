<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odds Converter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="images/converter-icon48.png" alt="" width="32" height="32" />
        <h1>Odds Converter</h1>
      </div>
      <button id="calculator-view-button" class="header-button" type="button">Calculator</button>
    </header>

    <main aria-label="Odds Converter settings">
      <div id="settings-view">
        <section class="card site-card" aria-labelledby="conversion-heading">
          <h2 id="conversion-heading" class="sr-only">Current page</h2>
          <label class="toggle-row primary-toggle">
            <span
              ><strong>Convert on this site</strong
              ><small id="hostname">Checking current page…</small></span
            >
            <input id="site-enabled" type="checkbox" role="switch" />
          </label>
          <p id="status" class="sr-only" aria-live="polite">Checking this page…</p>
        </section>

        <section class="card preferences" aria-labelledby="display-heading">
          <h2 id="display-heading" class="sr-only">Display settings</h2>
          <label class="setting-row" for="display-mode">
            <span>Format</span>
            <select id="display-mode">
              <option value="append">+140 (42% implied)</option>
              <option value="append-compact">+140 (41.7%)</option>
              <option value="replace">41.7%</option>
            </select>
          </label>
          <label class="setting-row" for="live-updates">
            <span><strong>Live updates</strong><small>Watch changing odds</small></span>
            <input id="live-updates" type="checkbox" role="switch" />
          </label>
          <label class="setting-row" for="maximum-odds">
            <span>Largest odds</span>
            <select id="maximum-odds">
              <option value="1000">±1,000</option>
              <option value="10000">±10,000</option>
              <option value="100000">±100,000</option>
            </select>
          </label>
        </section>

        <button id="sites-view-button" class="navigation-button" type="button">
          <span><strong>Sites</strong><small>Manage saved websites and the default</small></span>
          <span id="sites-count" class="navigation-value">0 saved →</span>
        </button>
      </div>

      <section id="sites-view" class="secondary-view" aria-labelledby="sites-heading" hidden>
        <div class="view-heading">
          <button class="back-button" data-back type="button" aria-label="Back to settings">
            ←
          </button>
          <div>
            <h2 id="sites-heading">Sites</h2>
            <p>Manage where conversion runs</p>
          </div>
        </div>
        <div class="card">
          <label class="toggle-row primary-toggle">
            <span><strong>Enable by default</strong><small>For all websites I visit</small></span>

            <input id="global-enabled" type="checkbox" role="switch" />
          </label>
        </div>
        <section class="card sites-card" aria-labelledby="saved-sites-heading">
          <h3 id="saved-sites-heading">Saved sites</h3>
          <div id="site-rules-list" class="sites-list"></div>
          <p id="empty-sites" class="empty-sites">
            Sites appear here after you use the current-site toggle.
          </p>
        </section>
      </section>

      <section
        id="calculator-view"
        class="secondary-view"
        aria-labelledby="calculator-heading"
        hidden
      >
        <div class="view-heading">
          <button class="back-button" data-back type="button" aria-label="Back to settings">
            ←
          </button>
          <div>
            <h2 id="calculator-heading">Calculator</h2>
            <p>American odds to implied probability</p>
          </div>
        </div>
        <div class="card calculator">
          <label for="calculator-input">American odds</label>
          <input
            id="calculator-input"
            inputmode="text"
            placeholder="e.g. -110"
            autocomplete="off"
          />
          <output id="calculator-output" for="calculator-input" aria-live="polite"></output>
        </div>
      </section>
    </main>
    <footer>Probabilities include the sportsbook's vig. Bet responsibly.</footer>
    <script src="js/popup.js"></script>
  </body>
</html>
